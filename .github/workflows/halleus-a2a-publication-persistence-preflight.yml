name: Halleus Batch A2a publication persistence preflight

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  windows-runner:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - name: Checkout preflight branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.18.0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Execute stable PowerShell 5.1 harness
        shell: powershell
        run: |
          & powershell.exe `
            -NoProfile `
            -ExecutionPolicy Bypass `
            -File ".github/halleus-preflight/a2a-harness.ps1"
          if ($LASTEXITCODE -ne 0) {
            throw "A2A_HARNESS_FAILED=$LASTEXITCODE"
          }

      - name: Upload exact candidate evidence
        uses: actions/upload-artifact@v4
        with:
          name: Halleus-Batch-A2a-candidate-evidence
          path: ${{ runner.temp }}/halleus-a2a-evidence
          if-no-files-found: error
          retention-days: 7

  postgres-migration:
    runs-on: ubuntu-latest
    needs: windows-runner
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: halleus_preflight
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d halleus_preflight"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: halleus_preflight
    steps:
      - name: Checkout preflight branch
        uses: actions/checkout@v4

      - name: Download exact candidate evidence
        uses: actions/download-artifact@v4
        with:
          name: Halleus-Batch-A2a-candidate-evidence
          path: evidence

      - name: Apply and verify migration in disposable Postgres
        shell: bash
        run: bash .github/halleus-preflight/a2a-postgres.sh

name: Halleus Batch A2a publication persistence preflight

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  windows-runner:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout preflight branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.18.0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Reconstruct exact runner
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $runner = Join-Path $env:RUNNER_TEMP "Apply-Halleus-Report-Publication-Persistence-A2a-20260801.ps1"
          $encoded = (1..4 | ForEach-Object {
            Get-Content -LiteralPath ".github/halleus-preflight/a2a-runner.part$_" -Raw
          }) -join ""
          $bytes = [Convert]::FromBase64String($encoded)
          $input = New-Object IO.MemoryStream(,$bytes)
          $gzip = New-Object IO.Compression.GZipStream($input, [IO.Compression.CompressionMode]::Decompress)
          $output = [IO.File]::Create($runner)
          try { $gzip.CopyTo($output) } finally { $output.Dispose(); $gzip.Dispose(); $input.Dispose() }
          $sha = (Get-FileHash -LiteralPath $runner -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($sha -ne "71f2f295e39286388ae324795480c4652d9a6b3e17411cf80df67dcfe576e741") {
            throw "RUNNER_SHA_MISMATCH=$sha"
          }
          Write-Host "RUNNER_SHA256=$sha"

      - name: Execute rollback rehearsal and exact apply
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $baseline = "4901e6a25cf6f7d818efd094d5e3dbfeb3ed62d1"
          $runner = Join-Path $env:RUNNER_TEMP "Apply-Halleus-Report-Publication-Persistence-A2a-20260801.ps1"
          $target = Join-Path $env:RUNNER_TEMP "halleus-a2a-target"
          $evidence = Join-Path $env:RUNNER_TEMP "halleus-a2a-evidence"
          Remove-Item -LiteralPath $target, $evidence -Recurse -Force -ErrorAction SilentlyContinue
          git fetch origin main --tags
          git show-ref --verify --quiet refs/heads/main
          if ($LASTEXITCODE -eq 0) {
            git branch -D main
          }
          git branch main $baseline
          git worktree add $target main
          Push-Location $target
          try {
            pnpm install --frozen-lockfile
            if ($LASTEXITCODE -ne 0) { throw "PNPM_INSTALL_FAILED" }
          } finally { Pop-Location }
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File $runner -Mode Rehearse -RepoPath $target
          if ($LASTEXITCODE -ne 0) { throw "RUNNER_REHEARSAL_FAILED" }
          $afterRehearsal = @(git -C $target status --porcelain)
          if ($afterRehearsal.Count -gt 0) {
            $afterRehearsal | ForEach-Object { Write-Host $_ }
            throw "REHEARSAL_DID_NOT_ROLL_BACK"
          }
          Write-Host "ROLLBACK_REHEARSAL=PASS"
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File $runner -Mode Apply -RepoPath $target
          if ($LASTEXITCODE -ne 0) { throw "RUNNER_APPLY_FAILED" }
          $expected = @(
            "app/api/reports/account/route.ts",
            "app/api/reports/beta/route.ts",
            "config/halleus-check-impact.json",
            "database/migrations/0009_report_publication_persistence.sql",
            "lib/database/postgres-report-database-driver.ts",
            "lib/database/report-row-mapper.ts",
            "lib/reports/report-access-service.ts",
            "lib/storage/account-report-save-client.ts",
            "lib/storage/database-report-repository.ts",
            "lib/storage/report-records.ts",
            "lib/storage/server-report-persistence.ts",
            "package.json",
            "scripts/check-report-publication-persistence.mjs",
            "types/storage.ts"
          )
          $actual = @(git -C $target status --porcelain | ForEach-Object { $_.Substring(3).Replace("\\", "/") } | Sort-Object)
          $expectedSorted = @($expected | Sort-Object)
          if (($actual -join "`n") -ne ($expectedSorted -join "`n")) {
            throw "CHANGED_FILE_BOUNDARY_MISMATCH actual=$($actual -join ',')"
          }
          New-Item -ItemType Directory -Path $evidence -Force | Out-Null
          Copy-Item -LiteralPath $runner -Destination (Join-Path $evidence (Split-Path $runner -Leaf))
          foreach ($relative in $expected) {
            $source = Join-Path $target ($relative -replace "/", [IO.Path]::DirectorySeparatorChar)
            $destination = Join-Path $evidence ($relative -replace "/", [IO.Path]::DirectorySeparatorChar)
            New-Item -ItemType Directory -Path (Split-Path -Parent $destination) -Force | Out-Null
            Copy-Item -LiteralPath $source -Destination $destination -Force
          }
          $manifest = @()
          $manifest += "BASELINE=$baseline"
          $manifest += "RUNNER_SHA256=$((Get-FileHash -LiteralPath $runner -Algorithm SHA256).Hash.ToLowerInvariant())"
          foreach ($relative in $expectedSorted) {
            $blob = (git -C $target hash-object -- $relative).Trim()
            $manifest += "AFTER_BLOB $relative $blob"
          }
          $manifest += "STATUS"
          $manifest += @(git -C $target status --short)
          $manifest += "DIFF_CHECK"
          git -C $target diff --check
          if ($LASTEXITCODE -ne 0) { throw "FINAL_DIFF_CHECK_FAILED" }
          $manifest += "WINDOWS_EXACT_PREFLIGHT=PASS"
          Set-Content -LiteralPath (Join-Path $evidence "manifest.txt") -Value $manifest -Encoding UTF8
          Write-Host ($manifest -join "`n")

      - name: Upload exact after-state evidence
        uses: actions/upload-artifact@v4
        with:
          name: Halleus-Batch-A2a-candidate-evidence
          path: ${{ runner.temp }}/halleus-a2a-evidence
          if-no-files-found: error
          retention-days: 7

  postgres-migration:
    runs-on: ubuntu-latest
    needs: windows-runner
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: halleus_preflight
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d halleus_preflight"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGPASSWORD: postgres
    steps:
      - name: Download exact after-state evidence
        uses: actions/download-artifact@v4
        with:
          name: Halleus-Batch-A2a-candidate-evidence
          path: evidence

      - name: Apply and verify migration in disposable Postgres
        shell: bash
        run: |
          set -Eeuo pipefail
          psql -h 127.0.0.1 -U postgres -d halleus_preflight <<'SQL'
          create table public.halleus_reports (
            id text primary key,
            user_id text not null,
            report_json jsonb not null default '{}'::jsonb,
            note text,
            favorite boolean not null default false,
            visibility text not null default 'private',
            source text not null default 'account',
            title text,
            share_token_hash text,
            share_enabled boolean not null default false,
            restricted_at timestamptz,
            restricted_by uuid,
            restriction_reason text,
            deleted_at timestamptz,
            deleted_by uuid,
            delete_reason text,
            created_at timestamptz not null default now(),
            updated_at timestamptz not null default now()
          );
          insert into public.halleus_reports (id, user_id, visibility, share_enabled, share_token_hash)
          values
            ('legacy-private', 'u1', 'private', false, null),
            ('legacy-shared', 'u1', 'shared_by_link', true, 'token-hash'),
            ('legacy-restricted', 'u1', 'restricted_by_admin', false, null),
            ('legacy-unpublished', 'u1', 'unpublished', false, null);
          SQL
          psql -v ON_ERROR_STOP=1 -h 127.0.0.1 -U postgres -d halleus_preflight \
            -f evidence/database/migrations/0009_report_publication_persistence.sql
          psql -v ON_ERROR_STOP=1 -h 127.0.0.1 -U postgres -d halleus_preflight <<'SQL'
          do $$
          declare invalid_count integer;
          begin
            select count(*) into invalid_count
            from public.halleus_reports
            where publication_owner_kind <> 'legacy'
               or access_tier <> 'free'
               or identity_consent_state <> 'withheld'
               or publication_policy_version <> '1';
            if invalid_count <> 0 then raise exception 'legacy backfill mismatch'; end if;
            if (select publication_state from public.halleus_reports where id='legacy-private') <> 'private' then raise exception 'private backfill mismatch'; end if;
            if (select publication_state from public.halleus_reports where id='legacy-shared') <> 'private' then raise exception 'shared-link publication must stay private'; end if;
            if (select visibility from public.halleus_reports where id='legacy-shared') <> 'shared_by_link' then raise exception 'sharing visibility was altered'; end if;
            if (select publication_state from public.halleus_reports where id='legacy-restricted') <> 'restricted' then raise exception 'restricted backfill mismatch'; end if;
            if (select publication_state from public.halleus_reports where id='legacy-unpublished') <> 'unpublished' then raise exception 'unpublished backfill mismatch'; end if;
          end $$;
          do $$
          begin
            begin
              update public.halleus_reports set publication_state='public' where id='legacy-private';
              raise exception 'legacy public state was accepted';
            exception when check_violation then null;
            end;
          end $$;
          insert into public.halleus_reports (
            id, user_id, publication_owner_kind, access_tier, publication_intent,
            publication_state, publication_consent_state, identity_consent_state,
            publication_policy_version
          ) values (
            'premium-public', 'u2', 'account', 'premium', 'publish',
            'public', 'granted', 'withheld', '1'
          );
          do $$
          begin
            begin
              insert into public.halleus_reports (
                id, user_id, publication_owner_kind, access_tier, publication_intent,
                publication_state, publication_consent_state, identity_consent_state,
                publication_policy_version
              ) values (
                'premium-no-consent', 'u2', 'account', 'premium', 'publish',
                'public', 'pending', 'withheld', '1'
              );
              raise exception 'premium public state without consent was accepted';
            exception when check_violation then null;
            end;
          end $$;
          SQL
          echo "POSTGRES_MIGRATION_PREFLIGHT=PASS"

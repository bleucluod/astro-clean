name: Batch 1 Public Reports Activation Preflight

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  windows-runner:
    runs-on: windows-latest
    steps:
      - name: Checkout control branch
        uses: actions/checkout@v4
        with:
          path: control
          fetch-depth: 1

      - name: Checkout exact baseline
        uses: actions/checkout@v4
        with:
          ref: 1b941f6c3edc40cff0594e1516760da7ecc74c95
          path: target
          fetch-depth: 1
          fetch-tags: true

      - name: Reconstruct exact runner
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          @'
          import base64
          import lzma
          from pathlib import Path

          root = Path("control/.preflight/batch1")
          parts = [
              *(root / f"runner.correct{index:02d}.b64" for index in range(1, 7)),
              *(root / f"runner.part{index:02d}.b64" for index in range(3, 7)),
          ]
          expected_lengths = [
              5000, 5000, 5000, 5000, 5000, 5000,
              11000, 11000, 10032, 10032,
          ]
          actual_lengths = [
              len(path.read_text(encoding="utf-8").strip())
              for path in parts
          ]
          if actual_lengths != expected_lengths:
              raise SystemExit(
                  f"RUNNER_PART_LENGTH_MISMATCH={actual_lengths}"
              )
          encoded = "".join(
              path.read_text(encoding="utf-8").strip()
              for path in parts
          )
          if len(encoded) != 72064:
              raise SystemExit(f"RUNNER_BASE64_LENGTH={len(encoded)}")
          output = Path(
              "control/.preflight/batch1/"
              "Apply-Halleus-Public-Reports-Activation-Batch1-20260801.ps1"
          )
          output.write_bytes(lzma.decompress(base64.b64decode(encoded)))
          '@ | python -
          if ($LASTEXITCODE -ne 0) {
            throw "RUNNER_RECONSTRUCTION_FAILED=$LASTEXITCODE"
          }
          $runner = "control/.preflight/batch1/Apply-Halleus-Public-Reports-Activation-Batch1-20260801.ps1"
          $sha = (Get-FileHash $runner -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($sha -ne "98aa792830e8453c3f5ece02d666a009b7dc5f64a711db890bda76e19730bc99") {
            throw "RUNNER_SHA_MISMATCH=$sha"
          }
          $errors = $null
          [void][Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path $runner),
            [ref]$null,
            [ref]$errors
          )
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Host $_ }
            throw "RUNNER_PARSE_FAILED"
          }
          Write-Host "RUNNER_SHA256=$sha"
          Write-Host "RUNNER_PARSE=PASS"

      - name: Prepare exact target
        shell: pwsh
        working-directory: target
        run: |
          $ErrorActionPreference = "Stop"
          git switch -C main 1b941f6c3edc40cff0594e1516760da7ecc74c95
          git fetch origin main --tags
          if ((git rev-parse HEAD).Trim() -ne "1b941f6c3edc40cff0594e1516760da7ecc74c95") {
            throw "BASELINE_MISMATCH"
          }
          if ((git status --porcelain).Count -ne 0) {
            throw "TARGET_NOT_CLEAN"
          }

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.18.0
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install locked dependencies
        working-directory: target
        run: pnpm install --frozen-lockfile

      - name: Rollback rehearsal
        shell: powershell
        run: |
          & "control/.preflight/batch1/Apply-Halleus-Public-Reports-Activation-Batch1-20260801.ps1" `
            -Mode Rehearse `
            -RepoPath "${{ github.workspace }}\target"
          if ($LASTEXITCODE -ne 0) {
            throw "REHEARSAL_FAILED=$LASTEXITCODE"
          }

      - name: Apply and full verify
        shell: powershell
        run: |
          & "control/.preflight/batch1/Apply-Halleus-Public-Reports-Activation-Batch1-20260801.ps1" `
            -Mode Apply `
            -RepoPath "${{ github.workspace }}\target"
          if ($LASTEXITCODE -ne 0) {
            throw "APPLY_FAILED=$LASTEXITCODE"
          }

      - name: Capture exact after-state
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $allowed = @(
            "app/api/admin/reports/route.ts",
            "app/api/reports/account/route.ts",
            "app/dashboard/page.tsx",
            "app/dashboard/reports/[reportId]/page.tsx",
            "app/dashboard/reports/page.tsx",
            "app/privacy/page.tsx",
            "app/product/page.tsx",
            "app/reports/[reportId]/page.tsx",
            "app/reports/page.tsx",
            "app/reports/shared/[shareToken]/page.tsx",
            "app/sitemap.ts",
            "components/AccountReportTitleList.tsx",
            "components/ChartForm.tsx",
            "components/LocalReportTitleList.tsx",
            "components/ReportDetail.tsx",
            "config/halleus-check-impact.json",
            "database/migrations/0010_report_public_activation.sql",
            "lib/config/navigation.ts",
            "lib/config/seo.ts",
            "lib/reports/public-report-service.ts",
            "lib/reports/report-access-service.ts",
            "lib/storage/account-report-read-client.ts",
            "lib/storage/account-report-save-client.ts",
            "lib/storage/report-records.ts",
            "package.json",
            "scripts/check-public-report-activation.mjs",
            "scripts/check-report-publication-mutation.mjs",
          )
          New-Item -ItemType Directory -Path evidence/after-state -Force | Out-Null
          foreach ($path in $allowed) {
            $source = Join-Path "target" $path
            $destination = Join-Path "evidence/after-state" $path
            New-Item -ItemType Directory -Path (Split-Path $destination -Parent) -Force | Out-Null
            Copy-Item -LiteralPath $source -Destination $destination -Force
          }
          Copy-Item "control/.preflight/batch1/Apply-Halleus-Public-Reports-Activation-Batch1-20260801.ps1" "evidence/Apply-Halleus-Public-Reports-Activation-Batch1-20260801.ps1"
          Set-Location target
          git status --short | Out-File ../evidence/final-status.txt -Encoding utf8
          git --no-pager diff | Out-File ../evidence/final-diff.patch -Encoding utf8
          git --no-pager diff --check
          $changed = @(git status --porcelain=v1 --untracked-files=all | ForEach-Object { $_.Substring(3) } | Sort-Object)
          $expected = @($allowed | Sort-Object)
          if (Compare-Object $expected $changed) {
            throw "AFTER_STATE_BOUNDARY_MISMATCH"
          }
          "98aa792830e8453c3f5ece02d666a009b7dc5f64a711db890bda76e19730bc99  Apply-Halleus-Public-Reports-Activation-Batch1-20260801.ps1" |
            Out-File ../evidence/runner-sha256.txt -Encoding ascii
          "WINDOWS_EXACT_AFTER_STATE=PASS" |
            Out-File ../evidence/windows-result.txt -Encoding ascii

      - name: Upload exact evidence
        uses: actions/upload-artifact@v4
        with:
          name: Halleus-Batch1-Public-Reports-Activation-Evidence
          path: evidence
          if-no-files-found: error

  postgres-and-http:
    runs-on: ubuntu-24.04
    needs: windows-runner
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: halleus_batch1
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d halleus_batch1"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout exact baseline
        uses: actions/checkout@v4
        with:
          ref: 1b941f6c3edc40cff0594e1516760da7ecc74c95
          fetch-depth: 1

      - name: Download Windows exact after-state
        uses: actions/download-artifact@v4
        with:
          name: Halleus-Batch1-Public-Reports-Activation-Evidence
          path: evidence

      - name: Overlay exact after-state
        shell: bash
        run: |
          set -Eeuo pipefail
          cp -a evidence/after-state/. .
          test "$(sha256sum "evidence/Apply-Halleus-Public-Reports-Activation-Batch1-20260801.ps1" | cut -d ' ' -f 1)" = "98aa792830e8453c3f5ece02d666a009b7dc5f64a711db890bda76e19730bc99"
          git --no-pager diff --check

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.18.0
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: PostgreSQL behavior preflight
        env:
          HALLEUS_PUBLIC_REPORT_ACTIVATION_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/halleus_batch1
        run: pnpm run check:public-report-activation

      - name: Build against disposable PostgreSQL
        env:
          DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/halleus_batch1
          NEXT_PUBLIC_SITE_URL: https://halleus.ir
        run: pnpm build

      - name: HTTP route smoke
        env:
          DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/halleus_batch1
          NEXT_PUBLIC_SITE_URL: https://halleus.ir
        shell: bash
        run: |
          set -Eeuo pipefail
          pnpm start > /tmp/halleus-batch1-next.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true; cat /tmp/halleus-batch1-next.log' EXIT

          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:3000/reports >/tmp/public-hub.html; then
              break
            fi
            sleep 1
          done

          curl -fsS http://127.0.0.1:3000/reports > /tmp/public-hub.html
          grep -q "گزارش‌های عمومی هالیوس" /tmp/public-hub.html
          ! grep -q "تهران" /tmp/public-hub.html
          ! grep -q "1990-01-02" /tmp/public-hub.html

          curl -fsS http://127.0.0.1:3000/reports/11111111-1111-4111-8111-111111111111 > /tmp/public-detail.html
          grep -q 'name="robots" content="index, follow"' /tmp/public-detail.html
          grep -q 'rel="canonical" href="https://halleus.ir/reports/11111111-1111-4111-8111-111111111111"' /tmp/public-detail.html
          ! grep -q "تهران" /tmp/public-detail.html
          ! grep -q "مهمان" /tmp/public-detail.html

          curl -fsS http://127.0.0.1:3000/reports/33333333-3333-4333-8333-333333333333 > /tmp/private-fallback.html
          grep -q 'name="robots" content="noindex, nofollow"' /tmp/private-fallback.html
          ! grep -q "پریمیوم خصوصی" /tmp/private-fallback.html
          ! grep -q "رشت" /tmp/private-fallback.html

          curl -fsS http://127.0.0.1:3000/dashboard/reports > /tmp/private-hub.html
          grep -q 'name="robots" content="noindex, nofollow"' /tmp/private-hub.html

          redirect_headers="$(mktemp)"
          curl -sS -o /dev/null -D "$redirect_headers"             "http://127.0.0.1:3000/reports?source=account"
          grep -Eq '^HTTP/.* 30[78]' "$redirect_headers"
          grep -qi '^location: /dashboard/reports\?source=account' "$redirect_headers"

          curl -fsS http://127.0.0.1:3000/sitemap.xml > /tmp/sitemap.xml
          grep -q "/reports/11111111-1111-4111-8111-111111111111" /tmp/sitemap.xml
          grep -q "/reports/44444444-4444-4444-8444-444444444444" /tmp/sitemap.xml
          ! grep -q "/reports/33333333-3333-4333-8333-333333333333" /tmp/sitemap.xml
          ! grep -q "/reports/55555555-5555-4555-8555-555555555555" /tmp/sitemap.xml

          echo "POSTGRES_PUBLIC_REPORT_ACTIVATION=PASS"
          echo "HTTP_PUBLIC_REPORT_ACTIVATION=PASS"

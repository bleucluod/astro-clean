name: Halleus verify
on: [pull_request]
permissions:
  contents: read
concurrency:
  group: halleus-verify-${{ github.event.pull_request.number }}
  cancel-in-progress: true
env:
  BASE: 1b941f6c3edc40cff0594e1516760da7ecc74c95
  TAG: v0.1.376-report-publication-mutations
  PATCH_SHA: 0d453a7650fc861051248cf470f083bc034a54b1161ada0a8b8726cc07024aec
  RUNNER_SHA: 7427579e3a5ec749acd6afe0a24e95604c0d37d608d93f79b29529cecb79db9b
  RUNNER_NAME: Apply-Halleus-Batch1-Public-Reports-Activation-20260802.ps1
jobs:
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: halleus_batch1
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d halleus_batch1"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v6
        with: {fetch-depth: 0}
      - name: Reconstruct, verify and rehearse rollback
        shell: bash
        run: |
          set -Eeuo pipefail
          git fetch --no-tags origin main
          test "$(git rev-parse origin/main)" = "$BASE"
          test "$(git merge-base HEAD origin/main)" = "$BASE"
          test "$(git rev-list -n 1 "$TAG")" = "$BASE"
          cat .preflight/batch1.patch.part{1,2,3} | tr -d '\r\n' | base64 -d | gzip -d > /tmp/b1.patch
          echo "$PATCH_SHA  /tmp/b1.patch" | sha256sum -c
          git apply --check /tmp/b1.patch && git apply /tmp/b1.patch
          git --no-pager diff --check
          { git diff --name-only; git ls-files --others --exclude-standard; } | grep -v '^\.preflight/' | sort -u > /tmp/files
          diff -u .preflight/expected-files.txt /tmp/files
          git apply -R --check /tmp/b1.patch && git apply -R /tmp/b1.patch
          test -z "$(git diff --name-only)"
          test -z "$(git ls-files --others --exclude-standard | grep -v '^\.preflight/' || true)"
          git apply --check /tmp/b1.patch && git apply /tmp/b1.patch
          git --no-pager diff --check
          echo ROLLBACK_REHEARSAL=PASS
      - uses: pnpm/action-setup@v6
        with: {version: 11.9.0}
      - uses: actions/setup-node@v6
        with: {node-version: 24, cache: pnpm}
      - run: pnpm install --frozen-lockfile
      - name: Guards, PostgreSQL, lint and build
        env:
          HALLEUS_PUBLICATION_MUTATION_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/halleus_batch1
          HALLEUS_PUBLIC_REPORT_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/halleus_batch1
        run: |
          pnpm run check:plan --base "$BASE" --head HEAD
          pnpm run check:encoding
          pnpm run check:plan
          pnpm run verify
      - name: HTTP smoke and final boundary
        shell: bash
        env:
          DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/halleus_batch1
        run: |
          set -Eeuo pipefail
          pnpm start >/tmp/next.log 2>&1 & pid=$!
          trap 'kill "$pid" 2>/dev/null || true; cat /tmp/next.log' EXIT
          for i in $(seq 1 60); do [ "$(curl -sS -o /dev/null -w '%{http_code}' http://127.0.0.1:3000/reports || true)" = 200 ] && break; sleep 1; done
          test "$(curl -sS -o /dev/null -w '%{http_code}' http://127.0.0.1:3000/reports)" = 200
          test "$(curl -sS -o /dev/null -w '%{http_code}' http://127.0.0.1:3000/dashboard/reports)" = 200
          test "$(curl -sS -o /dev/null -w '%{http_code}' http://127.0.0.1:3000/sitemap.xml)" = 200
          test "$(curl -sS -o /dev/null -w '%{http_code}' http://127.0.0.1:3000/public-reports/not-valid)" = 404
          kill "$pid"; wait "$pid" || true; trap - EXIT
          git --no-pager diff --check
          { git diff --name-only; git ls-files --others --exclude-standard; } | grep -v '^\.preflight/' | sort -u > /tmp/final
          diff -u .preflight/expected-files.txt /tmp/final
          echo BATCH1_EXACT_AFTER_STATE=PASS
  windows:
    needs: linux
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
        with: {fetch-depth: 0}
      - uses: pnpm/action-setup@v6
        with: {version: 11.9.0}
      - uses: actions/setup-node@v6
        with: {node-version: 24, cache: pnpm}
      - name: Reconstruct exact runner and disposable baseline
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $b=(0..3|%{Get-Content ".preflight\runner.part.$($_.ToString('00'))" -Raw})-join''
          $m=[IO.MemoryStream]::new([Convert]::FromBase64String(($b-replace'\s','')),$false)
          $g=[IO.Compression.GZipStream]::new($m,[IO.Compression.CompressionMode]::Decompress)
          $o=[IO.MemoryStream]::new(); $g.CopyTo($o); $g.Dispose(); $m.Dispose()
          $r=Join-Path $env:RUNNER_TEMP $env:RUNNER_NAME; [IO.File]::WriteAllBytes($r,$o.ToArray()); $o.Dispose()
          if((Get-FileHash $r -Algorithm SHA256).Hash.ToLowerInvariant()-ne$env:RUNNER_SHA){throw'Runner hash mismatch'}
          $repo=Join-Path $env:RUNNER_TEMP 'b1repo'
          git clone --no-checkout $env:GITHUB_WORKSPACE $repo
          git -C $repo config core.autrlf false
          git -C $repo checkout -B main $env:BASE
          git -C $repo reset --hard $env:BASE
          git -C $repo remote set-url origin "https://github.com/${{ github.repository }}.git"
          git -C $repo update-ref refs/remotes/origin/main $env:BASE
          git -C $repo tag -f $env:TAG $env:BASE
          Copy-Item $r (Join-Path $repo $env:RUNNER_NAME)
          "B1_REPO=$repo"|Out-File $env:GITHUB_ENV -Append -Encoding utf8
          if((git -C $repo rev-parse HEAD).Trim()-ne$env:BASE){throw'HEAD mismatch'}
          if((git -C $repo rev-parse origin/main).Trim()-ne$env:BASE){throw'origin/main mismatch'}
          Write-Host DISPOSABLE_BASELINE=PASS
      - run: pnpm --dir $env:B1_REPO install --frozen-lockfile
        shell: powershell
      - name: Execute exact Windows PowerShell 5.1 runner
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $r=Join-Path $env:B1_REPO $env:RUNNER_NAME
          $out=Join-Path $env:RUNNER_TEMP 'out.log'; $err=Join-Path $env:RUNNER_TEMP 'err.log'
          $p=Start-Process powershell.exe -ArgumentList @('-NoLogo','-NoProfile','-ExecutionPolicy','Bypass','-File',$r,'-RepoPath',$env:B1_REPO) -Wait -PassThru -NoNewWindow -RedirectStandardOutput $out -RedirectStandardError $err
          Get-Content $out; if(Test-Path $err){Get-Content $err}
          if($p.ExitCode-ne0){throw"Runner failed: $($p.ExitCode)"}
          $t=((Get-Content $out)+(Get-Content $err -ErrorAction SilentlyContinue))-join"`n"
          @('BASELINE=PASS','ROLLBACK_REHEARSAL=PASS','BATCH1_PUBLIC_REPORTS_ACTIVATION=PASS')|%{if(-not$t.Contains($_)){throw"Missing marker $_"}}
      - name: Final Windows boundary
        shell: powershell
        run: |
          $a=@(git -C $env:B1_REPO diff --name-only;git -C $env:B1_REPO ls-files --others --exclude-standard)|?{$_-and$_-ne$env:RUNNER_NAME}|sort -Unique
          $e=Get-Content '.preflight\expected-files.txt'|?{$_}|sort -Unique
          if(Compare-Object $e $a){throw'Boundary mismatch'}
          git -C $env:B1_REPO --no-pager diff --check
          if($LASTEXITCODE-ne0){throw'Diff check failed'}
          Write-Host WINDOWS_EXACT_AFTER_STATE=PASS

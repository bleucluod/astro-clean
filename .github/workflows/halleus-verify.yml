name: Halleus verify

on:
  # Manual-only per account-wide owner request; PR checks won't run automatically.
  workflow_dispatch:
    inputs:
      base_sha:
        description: "Optional base SHA (default: parent of HEAD)"
        required: false
        type: string
      head_sha:
        description: "Optional head SHA (default: HEAD)"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: halleus-verify-manual-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.9.0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Restore Next.js build cache
        uses: actions/cache@v5
        with:
          path: ${{ github.workspace }}/.next/cache
          key: ${{ runner.os }}-next-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('app/**', 'components/**', 'lib/**', 'src/**', 'types/**') }}
          restore-keys: |
            ${{ runner.os }}-next-${{ hashFiles('pnpm-lock.yaml') }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run impact-based verification
        env:
          HALLEUS_BASE_SHA: ${{ inputs.base_sha }}
          HALLEUS_HEAD_SHA: ${{ inputs.head_sha }}
        run: |
          BASE="${HALLEUS_BASE_SHA:-$(git rev-parse HEAD^)}"
          HEAD="${HALLEUS_HEAD_SHA:-$(git rev-parse HEAD)}"
          pnpm run verify --base "$BASE" --head "$HEAD"

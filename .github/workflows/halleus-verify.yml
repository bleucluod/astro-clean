name: Halleus verify

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: halleus-verify-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.9.0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Restore Next.js build cache
        uses: actions/cache@v5
        with:
          path: ${{ github.workspace }}/.next/cache
          key: ${{ runner.os }}-next-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('app/**', 'components/**', 'lib/**', 'src/**', 'types/**') }}
          restore-keys: |
            ${{ runner.os }}-next-${{ hashFiles('pnpm-lock.yaml') }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run impact-based verification
        env:
          HALLEUS_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HALLEUS_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: pnpm run verify -- --base "$HALLEUS_BASE_SHA" --head "$HALLEUS_HEAD_SHA"
